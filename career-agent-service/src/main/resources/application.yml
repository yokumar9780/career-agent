server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: career-agent-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:career_agent}
    username: ${DB_USERNAME:career_agent}
    password: ${DB_PASSWORD:career_agent}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:career_agent}
    user: ${DB_USERNAME:career_agent}
    password: ${DB_PASSWORD:career_agent}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.3

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:993}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        store:
          protocol: imaps
        imaps:
          ssl:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-ID}

# JWT configuration
jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-is-a-placeholder-key-that-must-be-at-least-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Workflow configuration
workflow:
  schedule:
    cron: ${WORKFLOW_CRON:0 0 8 * * *}
    timezone: ${WORKFLOW_TIMEZONE:UTC}

# LLM rate limiting
llm:
  rate-limit:
    calls-per-minute: ${LLM_CALLS_PER_MINUTE:30}
    queue-capacity: ${LLM_QUEUE_CAPACITY:500}
    call-timeout-seconds: ${LLM_CALL_TIMEOUT:120}
    max-retries: ${LLM_MAX_RETRIES:3}
    initial-retry-delay-ms: ${LLM_INITIAL_RETRY_DELAY:2000}

# Document storage
documents:
  storage-path: ${DOCUMENT_STORAGE_PATH:./documents}

logging:
  level:
    root: INFO
    com.careeragent: DEBUG
    org.springframework.security: INFO
    org.flywaydb: DEBUG
