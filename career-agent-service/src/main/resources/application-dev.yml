# =============================================================================
# Career Agent — Dev Profile (verbose logging)
# =============================================================================
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Or set: SPRING_PROFILES_ACTIVE=dev
# =============================================================================

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # --- Application ---
    com.careeragent: TRACE

    # --- Spring Security (full auth chain debugging) ---
    org.springframework.security: DEBUG
    org.springframework.security.web: DEBUG
    org.springframework.security.authentication: TRACE
    org.springframework.security.authorization: TRACE
    org.springframework.security.web.FilterChainProxy: DEBUG

    # --- JPA / Hibernate ---
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

    # --- Spring Web (request/response) ---
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

    # --- Flyway ---
    org.flywaydb: DEBUG

    # --- Spring AI ---
    org.springframework.ai: DEBUG

    # --- Connection Pool ---
    com.zaxxer.hikari: DEBUG

    # --- Spring Boot Auto-configuration ---
    org.springframework.boot.autoconfigure: DEBUG
